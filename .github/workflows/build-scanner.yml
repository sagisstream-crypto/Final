name: Build VolScan scanner binaries

on:
  push:
    branches: ["**"]
    paths:
      - "scanner-service/**"
      - ".github/workflows/build-scanner.yml"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: volscan-scanner-linux
          - os: windows-latest
            artifact: volscan-scanner-windows
          - os: macos-latest
            artifact: volscan-scanner-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        working-directory: scanner-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build onefile executable
        working-directory: scanner-service
        run: >
          pyinstaller --onefile --clean --noconfirm
          --name volscan-scanner
          --collect-all aiohttp
          run.py

      - name: Smoke test (starts and answers on its port)
        if: runner.os != 'Windows'
        working-directory: scanner-service
        shell: bash
        run: |
          ./dist/volscan-scanner --port 8799 --host 127.0.0.1 &
          PID=$!
          sleep 4
          curl -sSf -m 5 http://127.0.0.1:8799/ > /dev/null
          kill $PID

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            scanner-service/dist/volscan-scanner*
          retention-days: 90
